name = "buddy-voice"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Names are children's data: keep request logs off.
[observability]
enabled = false

[vars]
GEMINI_TTS_MODEL = "gemini-3.8-flash-tts"

[[r2_buckets]]
binding = "VOICES"
bucket_name = "kids-buddy-voices"

[[ratelimits]]
name = "INSTALL_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "IP_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }
