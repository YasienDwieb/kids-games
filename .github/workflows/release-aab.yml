name: Release — build AAB & submit to Play

# Builds a production AAB on EAS, submits it to the Play **production** track as
# a draft, then pushes the en/ar store listing + release notes via Fastlane supply.
# By default the release stays a draft behind "Start rollout" in the Play Console;
# tick the `rollout` input to roll it out in the same job.
#
# Division of labour:
#   • EAS    — builds the AAB and owns versionCode (remote autoIncrement).
#   • Play   — receives the binary via `eas submit` (production track, draft).
#   • supply — attaches listing text/images/changelogs to that release.
#
# Production only, on purpose: routing releases through internal → closed →
# production is not required for an app that is already live, and it strands
# releases (1.2.0 sat on internal for weeks while production served 1.1.1). For a
# deliberate test build, run `eas submit --profile internal` by hand, then move it
# over with `fastlane promote` — never rebuild just to change track.
#
# The release lands as a **draft**, so listing and release notes are attached
# BEFORE it is sent for review. Rollout is the one irreversible step, hence
# opt-in: leave it off for a last look in the Console, then finish with
# `fastlane rollout version_code:<vc>` or "Start rollout".
#
# This workflow does NOT bump semver or push tags — the APK release workflow
# remains the version authority. versionCode (the only value Play requires to be
# unique) is auto-incremented remotely by EAS.

on:
  workflow_dispatch:
    inputs:
      rollout:
        description: "Start the production rollout (100%) once the listing is pushed. Off = leave the release as a draft."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-aab
  cancel-in-progress: false

jobs:
  release:
    name: Build AAB & submit to Play (production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - uses: expo/expo-github-action@v8
        with:
          eas-version: 20.1.0 # must satisfy eas.json cli.version (>= 20.1.0)
          token: ${{ secrets.EXPO_TOKEN }}

      # EAS resolves config plugins locally, so node_modules must be present.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Write Play service-account key
        env:
          PLAY_KEY: ${{ secrets.PLAY_STORE_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$PLAY_KEY" || { echo "::error::PLAY_STORE_KEY_JSON secret is empty"; exit 1; }
          printf '%s' "$PLAY_KEY" > fastlane/play-store-key.json

      - name: Build AAB (EAS, production profile)
        run: |
          set -euo pipefail
          eas build --platform android --profile production \
            --non-interactive --wait --json > build.json
          obj='(if type=="array" then .[0] else . end)'
          BUILD_ID=$(jq -r "${obj}.id" build.json)
          VERSION_CODE=$(jq -r "${obj}.appBuildVersion" build.json)
          [ -n "$BUILD_ID" ] && [ "$BUILD_ID" != "null" ] || { echo "::error::no build id"; exit 1; }
          [ -n "$VERSION_CODE" ] && [ "$VERSION_CODE" != "null" ] || { echo "::error::no versionCode"; exit 1; }
          echo "BUILD_ID=$BUILD_ID"       >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Built $BUILD_ID — versionCode $VERSION_CODE"

      # eas.json `submit.production.android` → track: production, releaseStatus: draft.
      - name: Submit AAB to Play (production · draft)
        run: |
          set -euo pipefail
          eas submit --platform android --profile production \
            --id "$BUILD_ID" --non-interactive

      # Listing text/images/changelogs attach to the release `eas submit` just
      # created on production. SUPPLY_JSON_KEY (absolute) overrides the Appfile
      # path so it resolves regardless of fastlane's working dir.
      - name: Push store listing (en/ar)
        env:
          SUPPLY_JSON_KEY: ${{ github.workspace }}/fastlane/play-store-key.json
        run: fastlane metadata version_code:"$VERSION_CODE" track:production

      - name: Push release notes (en/ar)
        env:
          SUPPLY_JSON_KEY: ${{ github.workspace }}/fastlane/play-store-key.json
        run: fastlane changelog version_code:"$VERSION_CODE" track:production

      # Draft → completed: sends the release for review and makes it live on
      # approval. Opt-in, and last: everything above only decorates a release
      # nobody can see yet.
      - name: Start production rollout (draft → completed)
        if: ${{ inputs.rollout }}
        env:
          SUPPLY_JSON_KEY: ${{ github.workspace }}/fastlane/play-store-key.json
        run: fastlane rollout version_code:"$VERSION_CODE" track:production

      - name: Left as draft
        if: ${{ !inputs.rollout }}
        run: echo "::notice::versionCode $VERSION_CODE is a DRAFT on production. Start it with 'fastlane rollout version_code:$VERSION_CODE' or the Console's Start rollout button."
